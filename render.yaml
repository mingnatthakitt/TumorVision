services:
  - type: web
    name: tumorvision
    env: python
    # Build frontend first, then install backend deps
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    # Start the FastAPI server which now also serves the React frontend
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: NODE_VERSION
        value: 20.10.0
      - key: TF_USE_LEGACY_KERAS
        value: "1"
      - key: CUDA_VISIBLE_DEVICES
        value: "-1"
